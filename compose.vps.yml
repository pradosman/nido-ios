services:
  nido:
    build:
      context: .
    image: nido:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NIDO_DATA_DIR: /data
    ports:
      - "127.0.0.1:43129:3000"
    volumes:
      - nido-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/nido').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  nido-data:
